const ROLE_CALIBRATION = Object.fromEntries(ROLES.map(role => {
  let expected = 0;
  let variance = 0;
  for (const question of QUESTIONS) {
    const scores = question.options.map(option => option.weights[role.code] || 0);
    const mean = scores.reduce((sum, value) => sum + value, 0) / scores.length;
    expected += mean;
    variance += scores.reduce((sum, value) => sum + (value - mean) ** 2, 0) / scores.length;
  }
  return [role.code, { expected, deviation: Math.sqrt(variance) }];
}));

  // Внешний экран не раскрывает веса, баллы или другие профессии.
  const stats = new Map(ROLES.map(role => [role.code, {
    role, points: 0, primaryCount: 0, lastPrimary: -1
  }]));
  QUESTIONS.forEach((question, index) => {
    if (answers[index] === null) return;
    const choice = question.options[answers[index]];
    for (const [code, value] of Object.entries(choice.weights)) {
      stats.get(code).points += value;
    }
    const main = stats.get(choice.primary);
    main.primaryCount += 1;
    main.lastPrimary = index;
  });
  const normalized = entry => {
    const baseline = ROLE_CALIBRATION[entry.role.code];
    return (entry.points - baseline.expected) / baseline.deviation;
  };
  return Array.from(stats.values())
    .sort((a, b) => normalized(b) - normalized(a) ||
      b.primaryCount - a.primaryCount ||
      b.lastPrimary - a.lastPrimary ||
      a.role.code.localeCompare(b.role.code))[0].role;
}
function renderResults() {
  if (countAnswers() !== QUESTIONS.length) {
    showToast("Чтобы увидеть результат, ответь на все 20 вопросов.");
    return;
  }
  currentScreen = "result";
  const winner = getWinner();
  document.title = `Твоя профессия — ${winner.name} · КиноТест`;
  app.innerHTML = `
    <section class="results results--single" aria-labelledby="results-title">
      <div class="results-heading">
        <div class="overline"><span class="overline-line"></span> ФИНАЛЬНЫЕ ТИТРЫ</div>
        <h1 id="results-title">Твоя <em>профессия</em></h1>
      </div>
      <div class="result-hero">
        <div class="result-emblem"><span class="result-emoji" aria-hidden="true">${winner.icon}</span></div>
        <div class="result-content">
          <div class="overline">ТВОЙ РЕЗУЛЬТАТ</div>
          <h2 class="result-name">${escapeHtml(winner.name)}</h2>
        </div>
      </div>
      <div class="results-actions">
        <button type="button" class="primary-btn" data-action="share">${SHARE} Поделиться результатом</button>
        <button type="button" class="secondary-btn" data-action="edit">${ARROW_LEFT} Изменить ответы</button>
        <button type="button" class="ghost-btn" data-action="restart">${RESTART} Пройти заново</button>
      </div>
      <p class="fine-print results-disclaimer">Развлекательный тест. Ответы и результаты нигде не сохраняются — после обновления страницы тест начнётся заново.</p>
    </section>`;
  refreshPagePosition();
}
function shareText() {
  const result = getWinner().name;
  const visitUrl = location.protocol === "https:" || location.protocol === "http:"
    ? `\nПройти тест: ${location.href.split(/[?#]/)[0]}` : "";
  return `Моя профессия в тесте «Кто ты из кинопроизводства?» — ${result}.${visitUrl}`;
}
async function copyText(value) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(value);
    return;
  }
  const area = document.createElement("textarea");
  area.value = value;
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.select();
  const didCopy = document.execCommand("copy");
  area.remove();
  if (!didCopy) throw new Error("Буфер обмена недоступен");
}
async function shareResult() {
  const text = shareText();
  if (navigator.share) {
    try {
      await navigator.share({ title: "Мой результат — КиноТест", text });
      return;
    } catch (err) {
      if (err.name === "AbortError") return;
    }
  }
  try {
    await copyText(text);
    showToast("Результат скопирован — теперь его можно отправить друзьям.");
  } catch {
    showToast("Не удалось скопировать автоматически. Попробуй другой браузер.");
  }
}

app.addEventListener("click", event => {
  const button = event.target.closest("[data-action]");
  if (!button || !app.contains(button) || button.disabled) return;
  const action = button.dataset.action;
  if (action === "start") { currentIndex = 0; renderQuestion(); }
  if (action === "choose") { setAnswer(Number(button.dataset.index)); }
  if (action === "back") {
    if (currentIndex === 0) renderIntro(true);
    else { currentIndex--; renderQuestion(); }
  }
  if (action === "next") {
    if (answers[currentIndex] === null) { showToast("Выбери один вариант ответа."); return; }
    if (currentIndex === QUESTIONS.length - 1) renderResults();
    else { currentIndex++; renderQuestion(); }
  }
  if (action === "edit") { currentIndex = QUESTIONS.length - 1; renderQuestion(); }
  if (action === "restart") { answers.fill(null); currentIndex = 0; renderIntro(true); }
  if (action === "share") void shareResult();
});

// Проверка: 20 вопросов, 6 ответов, 14 профессий, честное распределение весов.
function validateData() {
  if (QUESTIONS.length !== 20 || ROLES.length !== 14) throw new Error("Неверное число вопросов или профессий");
  const codes = new Set(ROLES.map(role => role.code));
  const exposure = Object.fromEntries(ROLES.map(role => [role.code, 0]));
  const strongCounts = Object.fromEntries(ROLES.map(role => [role.code, Array(6).fill(0)]));
  QUESTIONS.forEach(question => {
    if (question.options.length !== 6) throw new Error("В вопросе должно быть 6 ответов");
    const primaries = new Set();
    question.options.forEach((option, index) => {
      if (!option.text || !codes.has(option.primary)) throw new Error("Неизвестная профессия");
      const entries = Object.entries(option.weights);
      if (entries.length !== 3 || option.weights[option.primary] !== 4 ||
          !entries.every(([code, weight]) => codes.has(code) && [1,2,4].includes(weight)) ||
          entries.map(([,weight]) => weight).sort().join() !== '1,2,4') {
        throw new Error("Некорректное распределение баллов");
      }
      primaries.add(option.primary);
      strongCounts[option.primary][index]++;
      entries.forEach(([code, weight]) => { exposure[code] += weight; });
    });
    if (primaries.size !== 6) throw new Error("Повторение основной профессии в одном вопросе");
  });
  if (Object.values(exposure).some(total => total !== 60) ||
      Object.values(strongCounts).some(ct => ct.some(count => count < 1 || count > 2))) {
    throw new Error("Нарушен баланс ответов");
  }
}
validateData();
renderIntro();

</script>
